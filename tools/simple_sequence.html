<!doctype html><html><meta charset="utf-8"><title>5–2–5 test</title><style>body{background:#14212d;color:#ecf4fa;font:18px system-ui;padding:28px}button{padding:20px;font:inherit;background:#167865;color:white;border:0;border-radius:8px;margin:10px}pre{white-space:pre-wrap}</style><h1>5–2–5 test</h1><p>Forward 5 m → descend 2 m → forward 5 m → surface → stop and disarm.</p><p>Follows the starting heading in Cube’s local frame. Start at the water surface with space ahead and below.</p><button id="start">Start sequence</button><button id="abort">Abort / take control</button><pre id="status">Ready to start</pre><script>
let run=null; const status=document.getElementById('status');
async function command(body){const r=await fetch('/api/waypoint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||d.msg||JSON.stringify(d));return d;}
document.getElementById('start').onclick=async()=>{try{const d=await command({action:'simple_start'});run=d.run_id;status.textContent='Starting '+run;}catch(e){status.textContent=e.message;}};
document.getElementById('abort').onclick=async()=>{try{await command({action:'abort',run_id:run});}catch(e){status.textContent=e.message;}};
setInterval(async()=>{try{const d=await (await fetch('/api/waypoint')).json();const s=d.navigation?.streams?.waypoint?.data;if(s?.plan?.kind==='simple_sequence'){run=s.run_id;status.textContent=s.stage+' · '+s.reason;}}catch(e){status.textContent='GUI disconnected. Onboard sequence is independent of this page.';}},500);
</script></html>
