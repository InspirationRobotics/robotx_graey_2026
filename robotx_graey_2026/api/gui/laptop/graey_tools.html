<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/mission.css"><link rel="stylesheet" href="/crusader-theme.css"><script src="/graey-theme.js"></script><title>GRAEY camera / sonar</title></head><body>
<div class="grid" style="grid-template-columns:1fr 1fr">
<section class="box"><h2>Camera</h2><button id="cameraToggle">Open camera</button><p id="cameraStatus" role="status">Live view closed</p><img id="image" style="width:100%" alt="Camera live view"></section>
<section class="box"><h2>Sonar</h2><button id="sonarToggle">Open sonar</button><p id="sonarStatus" role="status">Live view closed</p><iframe id="sonar" title="Sonar live view" src="about:blank" style="width:100%;height:400px;border:0"></iframe></section>
</div><p>Live viewing does not record. Use Record to save camera and sonar data, then download the saved session. Closing a view does not stop recording.</p>
<script>
let visible=false;
const wanted={camera:false,sonar:false};
const image=document.getElementById('image'),sonar=document.getElementById('sonar');
function clearImage(){const old=image.getAttribute('src');image.removeAttribute('src');if(old?.startsWith('blob:'))URL.revokeObjectURL(old)}
function suspend(){clearImage();sonar.src='about:blank'}
addEventListener('message',e=>{if(e.origin===location.origin&&typeof e.data?.graeySensorsVisible==='boolean'){visible=e.data.graeySensorsVisible;if(!visible)suspend()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend()});
async function json(path,options){const r=await fetch(path,options),s=await r.json();if(!r.ok||s.ok===false)throw Error(s.msg||s.detail||`HTTP ${r.status}`);return s}
async function toggle(kind){
 const button=document.getElementById(kind+'Toggle'),status=document.getElementById(kind+'Status');
 if(wanted[kind]){wanted[kind]=false;button.textContent='Open '+kind;status.textContent='Live view closed';if(kind==='camera')clearImage();else sonar.src='about:blank';return}
 button.disabled=true;status.textContent='Opening '+kind+'…';
 try{const s=await json('/vehicle/8096/status');if(!(kind==='camera'?s.camUp:s.webUp)){
   const result=await json(kind==='camera'?'/vehicle/8096/camera/start':'/vehicle/8096/start?tool=map',{method:'POST'});
   if(result.msg&&!['ok','the cameras are already running','map is already running - stop it first'].includes(result.msg))throw Error(result.msg);
 }wanted[kind]=true;button.textContent='Close '+kind+' view';status.textContent='Waiting for live data…'}
 catch(e){status.textContent='Cannot open '+kind+': '+e.message}finally{button.disabled=false}
}
document.getElementById('cameraToggle').onclick=()=>toggle('camera');
document.getElementById('sonarToggle').onclick=()=>toggle('sonar');
async function tick(){
 try{if(visible&&!document.hidden&&(wanted.camera||wanted.sonar)){
  const s=await json('/vehicle/8096/status');
  if(wanted.camera){document.getElementById('cameraStatus').textContent=s.camUp?'Live camera':s.camLog?.join(' · ')||'Waiting for camera…';
   if(s.camUp){const r=await fetch('/vehicle/8080/frame.jpg');if(!r.ok)throw Error('Camera frame unavailable: HTTP '+r.status);const blob=await r.blob();if(visible&&!document.hidden&&wanted.camera){clearImage();image.src=URL.createObjectURL(blob)}}}
  if(wanted.sonar){document.getElementById('sonarStatus').textContent=s.webUp?'Live sonar':s.log?.join(' · ')||'Waiting for sonar…';if(s.webUp&&sonar.getAttribute('src')==='about:blank')sonar.src='/vehicle/8095/'}
 }}catch(e){for(const kind of ['camera','sonar'])if(wanted[kind])document.getElementById(kind+'Status').textContent='Live feed unavailable: '+e.message}
 setTimeout(tick,1000)
}tick();
</script></body></html>
