<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/mission.css"><link rel="stylesheet" href="/crusader-theme.css"><script src="/graey-theme.js"></script><title>GRAEY camera / sonar</title></head><body><div class="grid" style="grid-template-columns:1fr 1fr"><section class="box"><h2>Camera</h2><button onclick="command('/vehicle/8096/camera/start')">Start cameras</button><button onclick="command('/vehicle/8096/camera/stop')">Stop cameras</button><label><input id="view" type="checkbox"> View</label><p id="cameraStatus">Unknown</p><img id="image" style="width:100%" alt="Camera view disabled"></section><section class="box"><h2>Sonar</h2><button onclick="command('/vehicle/8096/start?tool=map')">Start sonar map</button><button onclick="command('/vehicle/8096/stop')">Stop sonar</button><label><input id="sonarView" type="checkbox" onchange="document.getElementById('sonar').src=this.checked?'/vehicle/8095/':'about:blank'"> View</label><iframe id="sonar" src="about:blank" style="width:100%;height:400px;border:0"></iframe></section></div><p id="message"></p><script>
let visible=false;addEventListener('message',e=>{if(e.origin===location.origin&&typeof e.data?.graeySensorsVisible==='boolean'){visible=e.data.graeySensorsVisible;if(!visible){document.getElementById('sonar').src='about:blank';document.getElementById('image').removeAttribute('src')}}});async function command(path){try{let r=await fetch(path,{method:'POST'}),s=await r.json();document.getElementById('message').textContent=s.msg||JSON.stringify(s)}catch(e){document.getElementById('message').textContent=String(e)}}async function tick(){try{if(visible&&!document.hidden){let r=await fetch('/vehicle/8096/status'),s=await r.json();document.getElementById('cameraStatus').textContent=(s.camUp?'Camera running':'Camera unavailable')+(s.recording?' · recording':'');if(document.getElementById('view').checked&&s.camUp){let r=await fetch('/vehicle/8080/frame.jpg');if(r.ok){const image=document.getElementById('image'),old=image.src;image.src=URL.createObjectURL(await r.blob());if(old.startsWith('blob:'))URL.revokeObjectURL(old)}}}}catch(e){}setTimeout(tick,1000)}tick();
</script></body></html>
